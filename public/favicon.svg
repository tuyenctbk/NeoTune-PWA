<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="favBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#241242"/>
      <stop offset="70%" stop-color="#0b0512"/>
      <stop offset="100%" stop-color="#040106"/>
    </radialGradient>
    <linearGradient id="favNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="40%" stop-color="#8b5cf6"/>
      <stop offset="80%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- High-contrast rounded squircle base -->
  <rect width="64" height="64" rx="16" fill="url(#favBg)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1"/>

  <!-- Radio Waves -->
  <path d="M14 26 A 20 20 0 0 1 50 26" fill="none" stroke="url(#favNeon)" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
  <path d="M19 31 A 14 14 0 0 1 45 31" fill="none" stroke="url(#favNeon)" stroke-width="2.5" stroke-linecap="round" opacity="0.95"/>

  <!-- Sound Equalizer Bars -->
  <rect x="22" y="36" width="3.5" height="15" rx="1.75" fill="url(#favNeon)"/>
  <rect x="27.5" y="32" width="3.5" height="19" rx="1.75" fill="url(#favNeon)"/>
  <rect x="33" y="28" width="3.5" height="23" rx="1.75" fill="url(#favNeon)"/>
  <rect x="38.5" y="32" width="3.5" height="19" rx="1.75" fill="url(#favNeon)"/>
  <rect x="44" y="36" width="3.5" height="15" rx="1.75" fill="url(#favNeon)"/>

  <!-- Glowing Transmitter Beacon Dot -->
  <circle cx="32" cy="19" r="3" fill="#00f0ff"/>
  <circle cx="32" cy="19" r="1.5" fill="#ffffff"/>
</svg>
