<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="favBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2A1448"/>
      <stop offset="60%" stop-color="#120722"/>
      <stop offset="100%" stop-color="#080212"/>
    </radialGradient>
    <linearGradient id="favNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="45%" stop-color="#A855F7"/>
      <stop offset="85%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- High-contrast rounded squircle base -->
  <rect width="64" height="64" rx="16" fill="url(#favBg)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="url(#favNeon)" stroke-width="1.5" opacity="0.4"/>

  <!-- Radio Arcing Waves -->
  <path d="M 12 24 A 22 22 0 0 1 52 24" fill="none" stroke="url(#favNeon)" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 17 29 A 17 17 0 0 1 47 29" fill="none" stroke="url(#favNeon)" stroke-width="2.5" stroke-linecap="round" opacity="0.95"/>

  <!-- Sound Equalizer Bars -->
  <rect x="20" y="35" width="3.5" height="15" rx="1.75" fill="url(#favNeon)"/>
  <rect x="25.5" y="31" width="3.5" height="19" rx="1.75" fill="url(#favNeon)"/>
  <rect x="31" y="27" width="3.5" height="23" rx="1.75" fill="url(#favNeon)"/>
  <rect x="36.5" y="31" width="3.5" height="19" rx="1.75" fill="url(#favNeon)"/>
  <rect x="42" y="35" width="3.5" height="15" rx="1.75" fill="url(#favNeon)"/>

  <!-- Glowing Transmitter Beacon Dot -->
  <circle cx="32" cy="17" r="2.5" fill="#00F0FF"/>
  <circle cx="32" cy="17" r="1.2" fill="#FFFFFF"/>
</svg>

