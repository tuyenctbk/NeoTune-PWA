<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160d24"/>
      <stop offset="50%" stop-color="#0a050e"/>
      <stop offset="100%" stop-color="#1a0b2e"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4"/>

  <!-- Radio Signal Waves -->
  <g filter="url(#glow)">
    <!-- Outer wave arc -->
    <path d="M128 200 A 160 160 0 0 1 384 200" fill="none" stroke="url(#neonGlow)" stroke-width="18" stroke-linecap="round" opacity="0.6"/>
    <!-- Middle wave arc -->
    <path d="M168 236 A 110 110 0 0 1 344 236" fill="none" stroke="url(#neonGlow)" stroke-width="18" stroke-linecap="round" opacity="0.85"/>
    
    <!-- Central Sound Equalizer Bars forming an 'N' / Radio Tower -->
    <rect x="200" y="250" width="22" height="120" rx="11" fill="url(#neonGlow)"/>
    <rect x="245" y="210" width="22" height="160" rx="11" fill="url(#neonGlow)"/>
    <rect x="290" y="250" width="22" height="120" rx="11" fill="url(#neonGlow)"/>

    <!-- Radio broadcast core pulse dot -->
    <circle cx="256" cy="180" r="14" fill="#38bdf8"/>
  </g>
</svg>
