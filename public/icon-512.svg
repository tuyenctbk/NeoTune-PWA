<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Dark Obsidian Violet Gradient -->
    <radialGradient id="icon512Bg" cx="50%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#230E3D"/>
      <stop offset="60%" stop-color="#110521"/>
      <stop offset="100%" stop-color="#07020E"/>
    </radialGradient>

    <!-- Vibrant Radio Wave Gradient (Cyan -> Violet -> Magenta) -->
    <linearGradient id="icon512Wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Vibrant Equalizer Bar Gradient (Violet -> Magenta -> Rose) -->
    <linearGradient id="icon512Bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#E879F9"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="512" height="512" rx="116" fill="url(#icon512Bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="url(#icon512Wave)" stroke-width="5" opacity="0.35"/>

  <!-- Radio Waves (Concentric Arches) -->
  <path d="M 96 240 A 160 160 0 0 1 416 240" fill="none" stroke="url(#icon512Wave)" stroke-width="24" stroke-linecap="round" opacity="0.85"/>
  <path d="M 142 240 A 114 114 0 0 1 370 240" fill="none" stroke="url(#icon512Wave)" stroke-width="24" stroke-linecap="round"/>

  <!-- 3 Equalizer Pillar Bars -->
  <!-- Left Bar -->
  <rect x="176" y="260" width="35" height="130" rx="17.5" fill="url(#icon512Bar)"/>
  <!-- Center Tall Bar -->
  <rect x="238.5" y="205" width="35" height="185" rx="17.5" fill="url(#icon512Bar)"/>
  <!-- Right Bar -->
  <rect x="301" y="260" width="35" height="130" rx="17.5" fill="url(#icon512Bar)"/>

  <!-- Glowing Transmitter Beacon Dot at Apex -->
  <circle cx="256" cy="126" r="22" fill="#00F0FF"/>
  <circle cx="256" cy="126" r="11" fill="#FFFFFF"/>
</svg>
