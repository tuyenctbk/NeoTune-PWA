<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Luxury Dark Metallic Gradient -->
    <radialGradient id="radialGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1136"/>
      <stop offset="60%" stop-color="#0c0614"/>
      <stop offset="100%" stop-color="#050208"/>
    </radialGradient>

    <!-- Cyberpunk Synthwave Neon Gradient -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="35%" stop-color="#7000ff"/>
      <stop offset="70%" stop-color="#ff007b"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>

    <!-- Cyan Pulse Gradient -->
    <linearGradient id="cyanPulsar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glass Specular Rim Border -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.45)"/>
      <stop offset="40%" stop-color="rgba(255, 255, 255, 0.1)"/>
      <stop offset="100%" stop-color="rgba(112, 0, 255, 0.25)"/>
    </linearGradient>

    <!-- Neon Multi-Layer Glow Filter -->
    <filter id="ultraGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect width="512" height="512" rx="120" fill="url(#radialGlow)"/>
  
  <!-- Subtle Internal Glow Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(0, 240, 255, 0.06)" stroke-width="2"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(112, 0, 255, 0.08)" stroke-width="1.5"/>

  <!-- Glass Specular Border -->
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="url(#glassBorder)" stroke-width="4"/>

  <!-- Main Glowing Audio / Radio Icon Graphic -->
  <g filter="url(#ultraGlow)">
    <!-- Radio Signal Waves (Pulsar Arcs) -->
    <path d="M106 200 A 170 170 0 0 1 406 200" fill="none" stroke="url(#neonGradient)" stroke-width="16" stroke-linecap="round" opacity="0.5"/>
    <path d="M148 232 A 122 122 0 0 1 364 232" fill="none" stroke="url(#neonGradient)" stroke-width="16" stroke-linecap="round" opacity="0.85"/>
    <path d="M190 262 A 75 75 0 0 1 322 262" fill="none" stroke="url(#neonGradient)" stroke-width="14" stroke-linecap="round" opacity="1.0"/>

    <!-- Dynamic Equalizer Bars forming an 'N' Monogram Structure -->
    <rect x="180" y="275" width="22" height="115" rx="11" fill="url(#neonGradient)"/>
    <rect x="218" y="245" width="22" height="145" rx="11" fill="url(#neonGradient)"/>
    <rect x="256" y="215" width="22" height="175" rx="11" fill="url(#neonGradient)"/>
    <rect x="294" y="245" width="22" height="145" rx="11" fill="url(#neonGradient)"/>
    <rect x="332" y="275" width="22" height="115" rx="11" fill="url(#neonGradient)"/>

    <!-- Radio Broadcast Transmitter Beacon -->
    <circle cx="256" cy="148" r="16" fill="#00f0ff"/>
    <circle cx="256" cy="148" r="8" fill="#ffffff"/>
  </g>
</svg>
