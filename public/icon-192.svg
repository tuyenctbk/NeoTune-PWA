<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="radialGlow192" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1136"/>
      <stop offset="60%" stop-color="#0c0614"/>
      <stop offset="100%" stop-color="#050208"/>
    </radialGradient>

    <linearGradient id="neonGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="35%" stop-color="#7000ff"/>
      <stop offset="70%" stop-color="#ff007b"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>

    <linearGradient id="glassBorder192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.4)"/>
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(112, 0, 255, 0.2)"/>
    </linearGradient>

    <filter id="glow192" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="192" height="192" rx="46" fill="url(#radialGlow192)"/>
  <rect width="188" height="188" x="2" y="2" rx="44" fill="none" stroke="url(#glassBorder192)" stroke-width="2"/>

  <g filter="url(#glow192)">
    <!-- Radio Waves -->
    <path d="M42 76 A 62 62 0 0 1 150 76" fill="none" stroke="url(#neonGrad192)" stroke-width="6.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M57 88 A 45 45 0 0 1 135 88" fill="none" stroke="url(#neonGrad192)" stroke-width="6.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M72 100 A 28 28 0 0 1 120 100" fill="none" stroke="url(#neonGrad192)" stroke-width="5.5" stroke-linecap="round" opacity="1"/>

    <!-- Equalizer Bars -->
    <rect x="68" y="104" width="8" height="42" rx="4" fill="url(#neonGrad192)"/>
    <rect x="82" y="93" width="8" height="53" rx="4" fill="url(#neonGrad192)"/>
    <rect x="96" y="82" width="8" height="64" rx="4" fill="url(#neonGrad192)"/>
    <rect x="110" y="93" width="8" height="53" rx="4" fill="url(#neonGrad192)"/>
    <rect x="124" y="104" width="8" height="42" rx="4" fill="url(#neonGrad192)"/>

    <!-- Broadcast beacon -->
    <circle cx="96" cy="56" r="6" fill="#00f0ff"/>
    <circle cx="96" cy="56" r="3" fill="#ffffff"/>
  </g>
</svg>
