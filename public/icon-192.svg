<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="radialGlow192" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2A1448"/>
      <stop offset="60%" stop-color="#120722"/>
      <stop offset="100%" stop-color="#080212"/>
    </radialGradient>

    <linearGradient id="neonGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="45%" stop-color="#A855F7"/>
      <stop offset="85%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <filter id="sharpGlow192" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="192" height="192" rx="44" fill="url(#radialGlow192)"/>
  <rect width="188" height="188" x="2" y="2" rx="42" fill="none" stroke="url(#neonGrad192)" stroke-width="2" opacity="0.35"/>

  <g filter="url(#sharpGlow192)">
    <!-- Radio Arcing Waves -->
    <path d="M 38 72 A 62 62 0 0 1 154 72" fill="none" stroke="url(#neonGrad192)" stroke-width="7" stroke-linecap="round" opacity="0.75"/>
    <path d="M 54 86 A 46 46 0 0 1 138 86" fill="none" stroke="url(#neonGrad192)" stroke-width="7" stroke-linecap="round" opacity="0.95"/>

    <!-- Sound Equalizer Bars -->
    <rect x="62" y="104" width="10" height="42" rx="5" fill="url(#neonGrad192)"/>
    <rect x="79" y="93" width="10" height="53" rx="5" fill="url(#neonGrad192)"/>
    <rect x="96" y="80" width="10" height="66" rx="5" fill="url(#neonGrad192)"/>
    <rect x="113" y="93" width="10" height="53" rx="5" fill="url(#neonGrad192)"/>
    <rect x="130" y="104" width="10" height="42" rx="5" fill="url(#neonGrad192)"/>

    <!-- Broadcast beacon dot -->
    <circle cx="96" cy="50" r="7" fill="#00F0FF"/>
    <circle cx="96" cy="50" r="4" fill="#FFFFFF"/>
  </g>
</svg>

