<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <!-- Background Dark Obsidian Violet Gradient -->
    <radialGradient id="icon192Bg" cx="50%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#230E3D"/>
      <stop offset="60%" stop-color="#110521"/>
      <stop offset="100%" stop-color="#07020E"/>
    </radialGradient>

    <!-- Vibrant Radio Wave Gradient (Cyan -> Violet -> Magenta) -->
    <linearGradient id="icon192Wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Vibrant Equalizer Bar Gradient (Violet -> Magenta -> Rose) -->
    <linearGradient id="icon192Bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#E879F9"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="192" height="192" rx="44" fill="url(#icon192Bg)"/>
  <rect width="188" height="188" x="2" y="2" rx="42" fill="none" stroke="url(#icon192Wave)" stroke-width="2" opacity="0.35"/>

  <!-- Radio Waves (Concentric Arches) -->
  <path d="M 36 90 A 60 60 0 0 1 156 90" fill="none" stroke="url(#icon192Wave)" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
  <path d="M 53 90 A 43 43 0 0 1 139 90" fill="none" stroke="url(#icon192Wave)" stroke-width="9" stroke-linecap="round"/>

  <!-- 3 Equalizer Pillar Bars -->
  <!-- Left Bar -->
  <rect x="66" y="98" width="13" height="49" rx="6.5" fill="url(#icon192Bar)"/>
  <!-- Center Tall Bar -->
  <rect x="89.5" y="77" width="13" height="70" rx="6.5" fill="url(#icon192Bar)"/>
  <!-- Right Bar -->
  <rect x="113" y="98" width="13" height="49" rx="6.5" fill="url(#icon192Bar)"/>

  <!-- Glowing Transmitter Beacon Dot at Apex -->
  <circle cx="96" cy="47" r="8" fill="#00F0FF"/>
  <circle cx="96" cy="47" r="4" fill="#FFFFFF"/>
</svg>
