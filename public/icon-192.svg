<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="icon192Bg" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#280F4A"/>
      <stop offset="55%" stop-color="#120524"/>
      <stop offset="100%" stop-color="#06020D"/>
    </radialGradient>

    <linearGradient id="icon192Wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="45%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="icon192Bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#C084FC"/>
      <stop offset="70%" stop-color="#E879F9"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <filter id="icon192Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00F0FF" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="192" height="192" rx="46" fill="url(#icon192Bg)"/>
  <rect width="188" height="188" x="2" y="2" rx="44" fill="none" stroke="url(#icon192Wave)" stroke-width="2.5" opacity="0.4"/>

  <!-- Radio Waves (Concentric Arches) -->
  <path d="M 36 88 A 60 60 0 0 1 156 88" fill="none" stroke="url(#icon192Wave)" stroke-width="8" stroke-linecap="round" opacity="0.85" filter="url(#icon192Glow)"/>
  <path d="M 52 88 A 44 44 0 0 1 140 88" fill="none" stroke="url(#icon192Wave)" stroke-width="8" stroke-linecap="round"/>

  <!-- 5 Equalizer Pillar Bars -->
  <rect x="52" y="110" width="11" height="34" rx="5.5" fill="url(#icon192Bar)"/>
  <rect x="71" y="96" width="11" height="48" rx="5.5" fill="url(#icon192Bar)"/>
  <rect x="90.5" y="78" width="11" height="66" rx="5.5" fill="url(#icon192Bar)"/>
  <rect x="110" y="96" width="11" height="48" rx="5.5" fill="url(#icon192Bar)"/>
  <rect x="129" y="110" width="11" height="34" rx="5.5" fill="url(#icon192Bar)"/>

  <!-- Glowing Transmitter Beacon Dot at Apex -->
  <circle cx="96" cy="46" r="10" fill="#00F0FF" opacity="0.35"/>
  <circle cx="96" cy="46" r="7.5" fill="#00F0FF"/>
  <circle cx="96" cy="46" r="3.75" fill="#FFFFFF"/>
</svg>
