<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Luxury Dark Metallic Gradient -->
    <radialGradient id="radialGlowMask" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e1136"/>
      <stop offset="60%" stop-color="#0c0614"/>
      <stop offset="100%" stop-color="#050208"/>
    </radialGradient>

    <!-- Cyberpunk Synthwave Neon Gradient -->
    <linearGradient id="neonGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="35%" stop-color="#7000ff"/>
      <stop offset="70%" stop-color="#ff007b"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>

    <filter id="ultraGlowMask" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Full bleed background -->
  <rect width="512" height="512" fill="url(#radialGlowMask)"/>

  <!-- Centered inside 80% safe zone (r=200px) -->
  <g filter="url(#ultraGlowMask)" transform="translate(0, 16)">
    <path d="M128 200 A 145 145 0 0 1 384 200" fill="none" stroke="url(#neonGradMask)" stroke-width="14" stroke-linecap="round" opacity="0.6"/>
    <path d="M164 230 A 105 105 0 0 1 348 230" fill="none" stroke="url(#neonGradMask)" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
    <path d="M200 258 A 65 65 0 0 1 312 258" fill="none" stroke="url(#neonGradMask)" stroke-width="12" stroke-linecap="round" opacity="1"/>

    <!-- Equalizer 'N' shape -->
    <rect x="194" y="270" width="18" height="96" rx="9" fill="url(#neonGradMask)"/>
    <rect x="225" y="244" width="18" height="122" rx="9" fill="url(#neonGradMask)"/>
    <rect x="256" y="218" width="18" height="148" rx="9" fill="url(#neonGradMask)"/>
    <rect x="287" y="244" width="18" height="122" rx="9" fill="url(#neonGradMask)"/>
    <rect x="318" y="270" width="18" height="96" rx="9" fill="url(#neonGradMask)"/>

    <circle cx="256" cy="158" r="14" fill="#00f0ff"/>
    <circle cx="256" cy="158" r="7" fill="#ffffff"/>
  </g>
</svg>
