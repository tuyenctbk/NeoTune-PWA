<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Dark Obsidian Violet Gradient -->
    <radialGradient id="iconMaskBg" cx="50%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#230E3D"/>
      <stop offset="60%" stop-color="#110521"/>
      <stop offset="100%" stop-color="#07020E"/>
    </radialGradient>

    <!-- Vibrant Radio Wave Gradient (Cyan -> Violet -> Magenta) -->
    <linearGradient id="iconMaskWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Vibrant Equalizer Bar Gradient (Violet -> Magenta -> Rose) -->
    <linearGradient id="iconMaskBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#E879F9"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
  </defs>

  <!-- Full Bleed Canvas for Maskable PWA Icon -->
  <rect width="512" height="512" fill="url(#iconMaskBg)"/>

  <!-- Centered Safe Zone Graphic -->
  <g transform="translate(0, 10)">
    <!-- Radio Waves (Concentric Arches) -->
    <path d="M 120 240 A 136 136 0 0 1 392 240" fill="none" stroke="url(#iconMaskWave)" stroke-width="20" stroke-linecap="round" opacity="0.85"/>
    <path d="M 158 240 A 98 98 0 0 1 354 240" fill="none" stroke="url(#iconMaskWave)" stroke-width="20" stroke-linecap="round"/>

    <!-- 3 Equalizer Pillar Bars -->
    <!-- Left Bar -->
    <rect x="188" y="258" width="30" height="110" rx="15" fill="url(#iconMaskBar)"/>
    <!-- Center Tall Bar -->
    <rect x="241" y="210" width="30" height="158" rx="15" fill="url(#iconMaskBar)"/>
    <!-- Right Bar -->
    <rect x="294" y="258" width="30" height="110" rx="15" fill="url(#iconMaskBar)"/>

    <!-- Glowing Transmitter Beacon Dot at Apex -->
    <circle cx="256" cy="142" r="18" fill="#00F0FF"/>
    <circle cx="256" cy="142" r="9" fill="#FFFFFF"/>
  </g>
</svg>
