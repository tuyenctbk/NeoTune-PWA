<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Luxury Dark Metallic Gradient -->
    <radialGradient id="radialGlowMask" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2A1448"/>
      <stop offset="60%" stop-color="#120722"/>
      <stop offset="100%" stop-color="#080212"/>
    </radialGradient>

    <!-- High-Contrast Neon Gradient -->
    <linearGradient id="neonGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="45%" stop-color="#A855F7"/>
      <stop offset="85%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <filter id="sharpGlowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Full bleed background -->
  <rect width="512" height="512" fill="url(#radialGlowMask)"/>

  <!-- Centered inside 80% safe zone -->
  <g filter="url(#sharpGlowMask)" transform="translate(0, 16)">
    <path d="M 128 190 A 145 145 0 0 1 384 190" fill="none" stroke="url(#neonGradMask)" stroke-width="16" stroke-linecap="round" opacity="0.75"/>
    <path d="M 164 228 A 105 105 0 0 1 348 228" fill="none" stroke="url(#neonGradMask)" stroke-width="16" stroke-linecap="round" opacity="0.95"/>

    <!-- Equalizer Bars -->
    <rect x="180" y="270" width="22" height="96" rx="11" fill="url(#neonGradMask)"/>
    <rect x="218" y="242" width="22" height="124" rx="11" fill="url(#neonGradMask)"/>
    <rect x="256" y="210" width="22" height="156" rx="11" fill="url(#neonGradMask)"/>
    <rect x="294" y="242" width="22" height="124" rx="11" fill="url(#neonGradMask)"/>
    <rect x="332" y="270" width="22" height="96" rx="11" fill="url(#neonGradMask)"/>

    <circle cx="256" cy="140" r="16" fill="#00F0FF"/>
    <circle cx="256" cy="140" r="9" fill="#FFFFFF"/>
  </g>
</svg>
