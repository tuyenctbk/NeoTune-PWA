<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="iconMaskBg" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#280F4A"/>
      <stop offset="55%" stop-color="#120524"/>
      <stop offset="100%" stop-color="#06020D"/>
    </radialGradient>

    <linearGradient id="iconMaskWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="45%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="iconMaskBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#C084FC"/>
      <stop offset="70%" stop-color="#E879F9"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <filter id="iconMaskGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#00F0FF" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Full Bleed Canvas for Maskable PWA Icon -->
  <rect width="512" height="512" fill="url(#iconMaskBg)"/>

  <!-- Centered Safe Zone Graphic (Scaled & centered within inner 80% safe circle) -->
  <g transform="translate(256, 256) scale(0.8) translate(-256, -240)">
    <!-- Radio Waves (Concentric Arches) -->
    <path d="M 96 236 A 160 160 0 0 1 416 236" fill="none" stroke="url(#iconMaskWave)" stroke-width="22" stroke-linecap="round" opacity="0.85" filter="url(#iconMaskGlow)"/>
    <path d="M 140 236 A 116 116 0 0 1 372 236" fill="none" stroke="url(#iconMaskWave)" stroke-width="22" stroke-linecap="round"/>

    <!-- 5 Equalizer Pillar Bars -->
    <rect x="140" y="295" width="28" height="92" rx="14" fill="url(#iconMaskBar)"/>
    <rect x="190" y="258" width="28" height="129" rx="14" fill="url(#iconMaskBar)"/>
    <rect x="242" y="210" width="28" height="177" rx="14" fill="url(#iconMaskBar)"/>
    <rect x="294" y="258" width="28" height="129" rx="14" fill="url(#iconMaskBar)"/>
    <rect x="344" y="295" width="28" height="92" rx="14" fill="url(#iconMaskBar)"/>

    <!-- Glowing Transmitter Beacon Dot at Apex -->
    <circle cx="256" cy="122" r="26" fill="#00F0FF" opacity="0.35"/>
    <circle cx="256" cy="122" r="20" fill="#00F0FF"/>
    <circle cx="256" cy="122" r="10" fill="#FFFFFF"/>
  </g>
</svg>
